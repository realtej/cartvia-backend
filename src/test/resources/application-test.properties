spring.datasource.url=jdbc:h2:mem:cartvia_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

cartvia.jwt.secret=test-jwt-secret-key-at-least-32-characters-long
cartvia.payment.webhook-secret=test-webhook-secret
cartvia.payment.mock-enabled=true
