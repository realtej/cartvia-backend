spring.application.name=cartvia-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/cartvia?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

cartvia.jwt.secret=${JWT_SECRET:change-me-in-production-use-at-least-32-chars}
cartvia.jwt.access-token-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:60}
cartvia.jwt.refresh-token-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
cartvia.jwt.reset-token-expiration-minutes=${JWT_RESET_EXPIRATION_MINUTES:30}

cartvia.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://10.0.2.2:8080}

cartvia.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:change-me-webhook-secret}
cartvia.payment.mock-enabled=${PAYMENT_MOCK_ENABLED:true}
cartvia.payment.upi-payee-address=${PAYMENT_UPI_PAYEE_ADDRESS:cartvia@razorpay}
cartvia.payment.upi-payee-name=${PAYMENT_UPI_PAYEE_NAME:CartVia}

cartvia.device.token-header=${DEVICE_TOKEN_HEADER:X-Device-Token}

cartvia.trolley.heartbeat-timeout-seconds=${TROLLEY_HEARTBEAT_TIMEOUT_SECONDS:180}

cartvia.websocket.endpoint=${WS_ENDPOINT:/ws}
cartvia.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:*}

logging.level.root=INFO
logging.level.com.cartvia=INFO
