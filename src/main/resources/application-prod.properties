spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.com.cartvia=INFO
logging.level.org.springframework.security=WARN

cartvia.jwt.secret=${JWT_SECRET}
cartvia.payment.mock-enabled=${PAYMENT_MOCK_ENABLED:false}
cartvia.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET}

server.error.include-message=never
server.error.include-stacktrace=never
